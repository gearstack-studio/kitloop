services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?Set SESSION_CSRF_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  tools:
    profiles: [tools]
    build:
      context: .
      target: server-test
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?Set SESSION_CSRF_SECRET in .env}
      DEMO_BORROWER_PASSWORD: ${DEMO_BORROWER_PASSWORD:?Set DEMO_BORROWER_PASSWORD in .env}
      DEMO_CUSTODIAN_PASSWORD: ${DEMO_CUSTODIAN_PASSWORD:?Set DEMO_CUSTODIAN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  db-test:
    profiles: [test]
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kitloop_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d kitloop_test']
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    profiles: [test]
    build:
      context: .
      target: server-test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-test:5432/kitloop_test?schema=public
      APP_ORIGIN: http://localhost:5173
      SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?Set SESSION_CSRF_SECRET in .env}
    command: [sh, -c, 'npm run db:deploy && npm test && npm run test:ready:live']
    depends_on:
      db-test:
        condition: service_healthy

  client-test:
    profiles: [test]
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    build:
      context: .
      target: client-test

volumes:
  postgres-data:
