name: Pull Request CI

on:
  pull_request:
    branches: [sprint-1-staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kitloop-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record tested commits
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf '## KitLoop CI evidence\n\n'
            printf 'PR head SHA: %s\n\n' "$PR_HEAD_SHA"
            printf 'Tested merge SHA: %s\n\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          docker version
          docker compose version

      - name: Validate GCP release tooling offline
        run: |
          for script in infra/gcp/*.sh .github/scripts/*.sh; do bash -n "$script"; done
          bash infra/gcp/guards.test.sh

      - name: Generate isolated synthetic configuration
        run: |
          config_file="$RUNNER_TEMP/kitloop-ci.env"
          printf 'COMPOSE_ENV_FILES=%s\n' "$config_file" >> "$GITHUB_ENV"
          bash .github/scripts/ci-env.sh "$config_file"

      - name: Validate Compose configuration
        run: docker compose --profile tools --profile test config --quiet

      - name: Build API, frontend, tools and test images
        run: docker compose --profile tools --profile test build --pull

      - name: Backend integration tests and live readiness
        run: docker compose --profile test run --rm test

      - name: Frontend tests
        run: docker compose --profile test run --rm client-test

      - name: Migrate and seed a fresh application database
        run: |
          docker compose up -d --wait db
          docker compose run --rm tools npm run db:deploy
          docker compose run --rm tools npm run db:seed

      - name: Start application and verify database-backed HTTP actions
        run: |
          docker compose up -d --wait
          docker compose run --rm tools node scripts/verify-docker.mjs

      - name: Verify production image, jobs and restart persistence
        run: |
          runtime_env="$RUNNER_TEMP/kitloop-production.env"
          trap 'rm -f -- "$runtime_env"' EXIT
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -e GITHUB_ACTIONS=true \
            -v "$RUNNER_TEMP:/test-output" tools \
            node scripts/prepare-production-test.mjs /test-output/kitloop-production.env
          bash .github/scripts/production-smoke.sh "$runtime_env"

      - name: Record result
        if: always()
        env:
          VERIFY_STATUS: ${{ job.status }}
        run: |
          printf 'Verification result before cleanup: **%s**\n' "$VERIFY_STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove CI containers, volumes and configuration
        if: always()
        run: |
          if [ -f "$COMPOSE_ENV_FILES" ]; then
            trap 'rm -f -- "$COMPOSE_ENV_FILES"' EXIT
            docker compose --profile tools --profile test down --volumes --remove-orphans
          fi
